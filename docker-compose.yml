services:
  db:
    image: postgres:16-alpine
    container_name: greencode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-greencode}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-greencode}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - greencode-network

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: greencode-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-greencode}?schema=public
      JWT_SECRET: ${JWT_SECRET:-segredo-de-producao-com-mais-de-32-caracteres-jwt-token!!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_ISSUER: ${JWT_ISSUER:-greencode-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-greencode-clients}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - greencode-network

volumes:
  postgres_data:
    name: greencode_postgres_data

networks:
  greencode-network:
    name: greencode_network
    driver: bridge
